name: Tests

on:
  pull_request:
    branches: [production]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration and E2E tests (requires secrets)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Fast: toolkit unit tests (no simulator, no credentials)
  # ────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Toolkit Unit Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test --skip LiveServiceTests 2>&1

  # ────────────────────────────────────────────────────────────────────────
  # Build all example apps (catches compile errors)
  # ────────────────────────────────────────────────────────────────────────
  build-examples:
    name: Build Examples
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: swift-media
            project: SwiftMedia.xcodeproj
            scheme: SwiftMedia
          - app: swift-events
            project: SwiftEvents.xcodeproj
            scheme: SwiftEvents
          - app: swift-users
            project: SwiftUsers.xcodeproj
            scheme: SwiftUsers
    steps:
      - uses: actions/checkout@v4

      - name: Find simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data['devices'].items(), reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid']); sys.exit(0)
          ")
          echo "id=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.app }}
        run: |
          xcodebuild build \
            -project examples/${{ matrix.app }}/${{ matrix.project }} \
            -scheme ${{ matrix.scheme }} \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5

  # ────────────────────────────────────────────────────────────────────────
  # Example app unit tests (simulator required, no credentials)
  # ────────────────────────────────────────────────────────────────────────
  example-unit-tests:
    name: Example Unit Tests
    runs-on: macos-15
    needs: build-examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: swift-media
            project: SwiftMedia.xcodeproj
            scheme: SwiftMedia
            test_target: SwiftMediaTests
          - app: swift-events
            project: SwiftEvents.xcodeproj
            scheme: SwiftEvents
            test_target: SwiftEventsTests
    steps:
      - uses: actions/checkout@v4

      - name: Find simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data['devices'].items(), reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid']); sys.exit(0)
          ")
          echo "id=$SIM" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.id }}" 2>/dev/null || true

      - name: Run ${{ matrix.app }} unit tests
        run: |
          xcodebuild test \
            -project examples/${{ matrix.app }}/${{ matrix.project }} \
            -scheme ${{ matrix.scheme }} \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -only-testing:${{ matrix.test_target }} \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E '(Test Case|passed|failed|skipped|\*\* TEST)' | tail -30

  # ────────────────────────────────────────────────────────────────────────
  # Integration + E2E tests (manual trigger or schedule)
  # Requires secrets: TEST_USER, TEST_PASSWORD
  # ────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration & E2E Tests
    runs-on: macos-15
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true'
    env:
      PROXY_URL: https://een-mobile-proxy.klaushofrichter.workers.dev
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$TEST_USER" ] || [ -z "$TEST_PASSWORD" ]; then
            echo "::error::TEST_USER and TEST_PASSWORD secrets are required"
            exit 1
          fi
          echo "Credentials available for $TEST_USER"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Acquire test credentials
        run: |
          PROXY_URL="$PROXY_URL" node scripts/get-test-token.js
          echo "Credentials acquired"

      - name: Run toolkit integration tests
        run: |
          PROXY_URL="$PROXY_URL" swift test --filter LiveServiceTests 2>&1 | tail -10

      - name: Find simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data['devices'].items(), reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid']); sys.exit(0)
          ")
          echo "id=$SIM" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.id }}" 2>/dev/null || true

      - name: Run E2E tests — swift-media
        run: |
          python3 -c "
          import json
          c = json.load(open('test-credentials.json'))
          c['expiresIn'] = str(c.get('expiresIn', 3600))
          json.dump(c, open('examples/swift-media/ui-test-credentials.json', 'w'), indent=2)
          "
          xcodebuild test \
            -project examples/swift-media/SwiftMedia.xcodeproj \
            -scheme SwiftMedia \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -only-testing:SwiftMediaUITests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E '(Test Case|passed|failed|skipped|\*\* TEST)' | tail -30

      - name: Run E2E tests — swift-events
        run: |
          python3 -c "
          import json
          c = json.load(open('test-credentials.json'))
          c['expiresIn'] = str(c.get('expiresIn', 3600))
          json.dump(c, open('examples/swift-events/ui-test-credentials.json', 'w'), indent=2)
          "
          xcodebuild test \
            -project examples/swift-events/SwiftEvents.xcodeproj \
            -scheme SwiftEvents \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -only-testing:SwiftEventsUITests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E '(Test Case|passed|failed|skipped|\*\* TEST)' | tail -30

      - name: Run E2E tests — swift-users
        run: |
          python3 -c "
          import json
          c = json.load(open('test-credentials.json'))
          c['expiresIn'] = str(c.get('expiresIn', 3600))
          json.dump(c, open('examples/swift-users/ui-test-credentials.json', 'w'), indent=2)
          "
          xcodebuild test \
            -project examples/swift-users/SwiftUsers.xcodeproj \
            -scheme SwiftUsers \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -only-testing:SwiftUsersUITests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E '(Test Case|passed|failed|skipped|\*\* TEST)' | tail -30

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f test-credentials.json
          rm -f examples/*/ui-test-credentials.json
